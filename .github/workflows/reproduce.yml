name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run all builds and checks
        run: ./run.sh

      - name: Regenerated results match the committed summary
        run: git diff --exit-code results/summary.md

      - name: Publish summary
        if: always()
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results
          path: results/
